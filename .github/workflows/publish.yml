name: Publish

# Publishes the plugin to npm via OIDC trusted publishing — no NPM_TOKEN, no OTP.
# The npm package is configured with this repository + this workflow filename as a
# trusted publisher, so the filename must stay `publish.yml`.
#
# Release flow:
#   cd plugin && npm version patch      # bumps plugin/package.json + root lockfile
#   git commit -am "chore(release): <version>" && git tag v<version>
#   git push origin main --follow-tags  # this workflow publishes the tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  publish:
    name: Publish strapi-plugin-translate-llm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      - name: Update npm
        run: npm install -g npm@latest

      # Full workspace install: a plugin-only install resolves different
      # @strapi/strapi typings and the declaration build then fails.
      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build --workspace strapi-plugin-translate-llm

      - name: Publish to npm
        run: npm publish --workspace strapi-plugin-translate-llm
